name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write  # needed to create GitHub Release + push appcast.xml

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so we can push appcast.xml back

      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_16.0.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "${candidate}/Contents/Developer"
              echo "DEVELOPER_DIR=${candidate}/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID signing cert
        env:
          DEV_ID_CERT_P12_BASE64: ${{ secrets.DEV_ID_CERT_P12_BASE64 }}
          DEV_ID_CERT_PASSWORD: ${{ secrets.DEV_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$DEV_ID_CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$DEV_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Build universal app
        env:
          ARCHES: "arm64 x86_64"
        run: ./scripts/package_app.sh release

      - name: Sign + notarize
        env:
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./scripts/sign-and-notarize.sh

      - name: Build signed + notarized DMG
        env:
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./scripts/build-dmg.sh

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle.key
          source version.env
          SPARKLE_PRIVATE_KEY_FILE=/tmp/sparkle.key \
            ./scripts/make_appcast.sh "Haynoi-${MARKETING_VERSION}-universal.zip"
          rm /tmp/sparkle.key

      - name: Read release notes
        id: notes
        run: |
          source version.env
          ./scripts/changelog-to-html.sh "$MARKETING_VERSION" > /tmp/notes.html
          {
            echo "html<<EOF"
            cat /tmp/notes.html
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Haynoi ${{ env.RELEASE_TAG }}
          body: ${{ steps.notes.outputs.html }}
          files: |
            Haynoi-*-universal.zip
            Haynoi-*.dmg
            Haynoi.dmg
            Haynoi-*-universal.dSYM.zip

      - name: Commit updated appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet appcast.xml; then
            echo "appcast.xml unchanged — nothing to commit"
          else
            git add appcast.xml
            git commit -m "release: ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
