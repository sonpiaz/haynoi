name: Haynoi
options:
  bundleIdPrefix: com.sonpiaz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0

targets:
  Haynoi:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        type: file
        buildPhase: resources
      - path: Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonpiaz.haynoi
        PRODUCT_NAME: Haynoi
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "30"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Haynoi.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "Apple Development: me.nguyentungson@gmail.com (LC36QSW9KK)"
        DEVELOPMENT_TEAM: 6WMWJ85DDY
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Resources/Haynoi.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.automation.apple-events: true

  HaynoiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Haynoi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonpiaz.haynoiTests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: 6WMWJ85DDY
        CODE_SIGN_IDENTITY: "Apple Development: me.nguyentungson@gmail.com (LC36QSW9KK)"
    scheme:
      testTargets:
        - HaynoiTests
